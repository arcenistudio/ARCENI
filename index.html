<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARCENI — Consulting, Training & Advisory</title>
  <meta name="description" content="A consulting and advisory for sustainable impact. Built for individuals and organizations to support projects and ecosystems.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--paper:#F4F1EE;--ink:#28252A;--muted:#68636A;--soft:#9B9293;--line:rgba(40,37,42,.12)}
    *{box-sizing:border-box}
    html{min-width:320px;min-height:100%;background:var(--paper)}
    body{min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .home-shell{display:flex;min-height:100svh;flex-direction:column;width:min(100% - 48px,1250px);margin:0 auto;padding:27px 0 34px}
    .home-topbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:22px;width:100%}
    .home-brand{justify-self:start;font-size:18px;font-weight:600;letter-spacing:.2em}
    .home-brand sup{position:relative;top:-.15em;margin-left:2px;font-size:8px;letter-spacing:0}
    .home-nav{display:flex;align-items:center;justify-content:center;gap:clamp(18px,2.3vw,34px);color:#6D676A;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
    .home-nav{position:absolute;left:50%;margin-left:0;transform:translateX(-50%)}
    .home-nav a{transition:color .22s ease}
    .home-nav a:hover,.home-nav a:focus-visible{color:var(--ink)}
    .home-nav a:focus-visible,.home-nav-cta:focus-visible{outline:2px solid #746B70;outline-offset:4px}
    .home-nav-cta{display:inline-flex;min-height:44px;align-items:center;justify-self:end;gap:14px;padding:5px 6px 5px 16px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.26);font-size:11px;font-weight:600;white-space:nowrap;transition:background .22s ease,transform .22s ease,box-shadow .22s ease}
    .home-nav-cta span{display:grid;width:32px;height:32px;place-items:center;border-radius:10px;background:#302C31;color:#fff;font-size:15px}
    .home-nav-cta:hover,.home-nav-cta:focus-visible{transform:translateY(-1px) scale(1.04);background:rgba(255,255,255,.68);box-shadow:0 5px 14px rgba(48,44,49,.08)}
    .home-hero{display:flex;flex:1;min-height:clamp(590px,calc(100svh - 112px),900px);flex-direction:column;align-items:center;justify-content:center;padding:64px 0 80px;text-align:center}
    .home-hero h1{max-width:1000px;margin:0;color:#1D1D1F;font-size:clamp(43px,6.3vw,76px);font-weight:500;line-height:1.04;letter-spacing:-.075em;text-wrap:balance}
    .home-hero h1 .hero-line{display:block}
    .home-hero-eyebrow{margin:0 0 18px;color:#B8B0B3;font-size:11px;font-weight:500;letter-spacing:.16em;line-height:1.4;text-transform:uppercase}
    .home-hero .hero-accent{display:inline;color:#989091;font-weight:500}
    .home-hero-intro{max-width:720px;margin:22px auto 0;color:#6F696C;font-size:clamp(15px,1.55vw,18px);font-weight:400;line-height:1.6}
    .home-hero-cta{display:inline-flex;align-items:center;justify-content:space-between;gap:18px;min-height:54px;margin-top:28px;padding:6px 7px 6px 22px;border:1px solid #F4F1EE;border-radius:999px;background:#F4F1EE;color:#282828;font-size:12px;font-weight:600;transition:transform .24s cubic-bezier(.16,1,.3,1),background .24s ease,border-color .24s ease,color .24s ease,box-shadow .24s ease}.home-hero-cta span{display:grid;width:40px;height:40px;place-items:center;border-radius:50%;background:#282828;color:#F4F1EE;font-size:17px;transition:transform .24s cubic-bezier(.16,1,.3,1),background .24s ease,color .24s ease}.home-hero-cta:hover,.home-hero-cta:focus-visible{transform:translateY(-3px);border-color:#F4F1EE;background:transparent;color:#F4F1EE;box-shadow:0 10px 28px rgba(0,0,0,.24)}.home-hero-cta:hover span,.home-hero-cta:focus-visible span{transform:rotate(45deg);background:#F4F1EE;color:#282828}
    
    .home-hero .hero-keyword{display:inline-block;transition:transform .28s cubic-bezier(.16,1,.3,1)}
    .home-hero .hero-keyword:hover,.home-hero .hero-accent:hover{transform:translateY(-5px)}
    .home-trust{margin:clamp(44px,7vh,76px) auto 0;text-align:center}
    .home-trust-label{margin:0 0 19px;color:#817A7D;font-size:11px;font-weight:400;line-height:1.4}
    .home-trust-items{display:flex;align-items:center;justify-content:center;gap:clamp(20px,3vw,38px);flex-wrap:wrap;color:#6D676A}
    .home-trust-items span{font-size:clamp(13px,1.4vw,16px);font-weight:500;letter-spacing:-.025em;white-space:nowrap;transition:color .2s ease,transform .2s ease;cursor:default}
    .home-trust-items span:hover{color:#FFFFFF;transform:translateY(-3px)}
    @media(max-width:760px){
      .home-shell{width:min(100% - 42px,620px);padding-top:20px}
      .home-topbar{grid-template-columns:1fr auto;row-gap:13px}
      .home-brand{font-size:16px}
      .home-nav{position:static;order:3;transform:none;width:100%;justify-content:center;gap:clamp(15px,4vw,25px);padding-top:13px;border-top:1px solid var(--line);font-size:10px}
      .home-nav-cta{grid-column:2;grid-row:1;min-height:40px;font-size:10px}
      .home-nav-cta span{width:28px;height:28px}
      .home-hero{min-height:calc(100svh - 105px);padding:60px 0 42px}
      .home-hero h1{font-size:clamp(40px,8.4vw,58px)}
      .home-hero-intro{max-width:580px;margin-top:19px}
      .home-trust{margin-top:48px}
    }
    @media(max-width:420px){
      .home-shell{width:calc(100% - 30px)}
      .home-nav{gap:13px;font-size:9px;letter-spacing:.08em}
      .home-nav-cta{gap:9px;padding-left:12px}
      .home-hero{padding-top:44px}
      .home-hero h1{font-size:clamp(35px,9.5vw,43px);letter-spacing:-.065em}
      .home-hero-intro{font-size:14px}
      .home-trust-items{gap:13px 18px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
      .site-social{width:min(100% - 48px,1250px);display:flex;align-items:center;justify-content:center;gap:22px;margin:0 auto;padding:26px 0 34px;color:#514B4F}
    .site-social a{display:grid;width:22px;height:22px;place-items:center;color:inherit;transition:opacity .2s ease,transform .2s ease}
    .site-social a:hover,.site-social a:focus-visible{opacity:.68;transform:translateY(-1px)}
    .site-social svg{display:block;width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    @media(max-width:560px){.site-social{width:calc(100% - 30px);padding:22px 0 28px}}
    html,body{width:100%;max-width:100%;overflow-x:hidden}
    .shell,.home-shell{width:min(calc(100% - 48px),1250px)}
    main,section,article,form,.feature,.grid,.consulting-services-grid,.collective-programs-layout,.programs-layout,.basketball-testimonial-section,.basketball-contact{min-width:0}
    img,svg,video{max-width:100%}
    h1,h2,h3,p,li,dd{overflow-wrap:break-word}
    @media(max-width:560px){.shell,.home-shell{width:calc(100% - 32px)}.section{padding:58px 0}.consulting-service-card{padding:24px}.consulting-service-stack .consulting-service-card{padding:22px}.basketball-contact{padding:32px 18px}.basketball-contact-form{padding:22px 18px}}
    @media(max-width:360px){.shell,.home-shell{width:calc(100% - 24px)}.nav{gap:10px;font-size:9px;letter-spacing:.06em}.cta{gap:8px;padding-left:10px}.basketball-contact{padding:28px 14px}.basketball-testimonial-section{padding-left:16px;padding-right:16px}}
    .hero h1,.hero h1 span,.home-hero h1,.home-hero h1 span,.home-hero .hero-accent{color:#1D1D1F!important}
    :root{--paper:#282828;--ink:#F4F1EE;--muted:#D0CBCD;--soft:#B8B0B3;--line:rgba(244,241,238,.2)}
    html,body{background:#282828;color:#F4F1EE}
    .home-nav{color:#D0CBCD}.home-nav a:hover,.home-nav a:focus-visible{color:#FFFFFF}
    .home-nav a:focus-visible,.home-nav-cta:focus-visible{outline-color:#F4F1EE}
    .home-nav-cta{background:rgba(255,255,255,.06);color:#F4F1EE;border-color:rgba(244,241,238,.24)}
    .home-nav-cta span{background:#F4F1EE;color:#282828}
    .home-nav-cta:hover,.home-nav-cta:focus-visible{background:rgba(255,255,255,.16);box-shadow:0 5px 16px rgba(0,0,0,.24)}
    .home-hero h1,.home-hero h1 span,.home-hero .hero-accent{color:#F4F1EE!important}
    .home-hero .hero-accent{display:inline-block;vertical-align:bottom;white-space:nowrap;color:#B8B0B3!important;transition:transform .28s cubic-bezier(.16,1,.3,1)}
    .home-hero .hero-accent{color:#B8B0B3!important}
    .home-hero-intro{color:#D0CBCD}.home-trust-label{color:#B8B0B3}.home-trust-items{color:#E4E0E1}
    .site-social{color:#F4F1EE}
    .home-about{position:absolute;left:50%;transform:translateX(-50%);color:#D0CBCD;font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
    .home-about:hover,.home-about:focus-visible{color:#FFFFFF}
    .home-social{display:flex;align-items:center;justify-content:flex-end;gap:18px;margin-left:auto;color:#F4F1EE}
    .home-social a{display:grid;width:22px;height:22px;place-items:center;color:inherit;transition:opacity .2s ease,transform .2s ease}
    .home-social a:hover,.home-social a:focus-visible{opacity:.7;transform:translateY(-1px)}
    .home-social svg{display:block;width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    @media(max-width:420px){.home-social{gap:12px}}

  </style>
</head>
<body>
  <main class="home-shell">
    <header class="home-topbar">
      <a class="home-brand" href="index.html" aria-label="ARCENI home">ARCENI<sup>®</sup></a>
      <nav class="home-social" aria-label="Social media links">
        <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.7" cy="6.5" r=".7" fill="currentColor" stroke="none"/></svg></a>
        <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 7.2a2.8 2.8 0 0 0-2-2C17.3 4.7 12 4.7 12 4.7s-5.3 0-7 .5a2.8 2.8 0 0 0-2 2A29 29 0 0 0 2.5 12a29 29 0 0 0 .5 4.8 2.8 2.8 0 0 0 2 2c1.7.5 7 .5 7 .5s5.3 0 7-.5a2.8 2.8 0 0 0 2-2 29 29 0 0 0 .5-4.8 29 29 0 0 0-.5-4.8Z"/><path d="m10 9 5 3-5 3z"/></svg></a>
        <a href="https://www.linkedin.com/company/arceni/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7v.01M12 17v-7m0 3a3 3 0 0 1 6 0v4"/></svg></a>
      </nav>
    </header>
    <section class="home-hero" aria-labelledby="home-title">
      <h1 id="home-title"><span class="hero-line"><span class="hero-accent">Strategy</span> for Change.</span><span class="hero-line">Clarity to <span class="hero-accent">Impact.</span></span></h1>
      <p class="home-hero-intro"> For individuals, organizations and ecosystems.</p>
      <a class="home-hero-cta" href="about.html">Our Story<span aria-hidden="true">↗</span></a>
      <div class="home-trust" aria-label="Sectors we work in">
        <p class="home-trust-label">Sectors We Work In</p>
        <div class="home-trust-items"><span>Nonprofits</span><span>Education</span><span>Sports</span><span>Leadership</span></div>
      </div>
    </section>
  </main>
</body>
</html>
