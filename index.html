<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181716">
  <meta name="description" content="ARCENI — coaching, consulting and basketball development.">
  <title>ARCENI — Home</title>
  <style>
    :root{color-scheme:dark;--canvas:#181716;--ink:#f4f1ee;--accent:#b8b0b3}
    *{box-sizing:border-box}
    html{min-width:320px;background:var(--canvas)}
    body{min-width:320px;min-height:100vh;margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .landing{position:relative;display:flex;width:min(calc(100% - 48px),1400px);min-height:100vh;min-height:100svh;flex-direction:column;margin:0 auto;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,rgba(184,176,179,.075),transparent 37%),var(--canvas)}
    .navbar{position:relative;z-index:2;display:flex;min-height:86px;align-items:center;justify-content:flex-start;padding:0;border:0}
    .basketball-brand{font-size:18px;font-weight:750;letter-spacing:.17em}
    .basketball-brand sup{margin-left:2px;font-size:9px;letter-spacing:0;vertical-align:top}
    .work-menu{position:relative;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
    .work-menu summary{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;list-style:none}
    .work-menu summary::-webkit-details-marker{display:none}
    .work-menu summary::after{content:'+';font-size:16px;font-weight:400;transition:transform .2s ease}
    .work-menu[open] summary::after{transform:rotate(45deg)}
    .work-links{position:absolute;z-index:4;top:calc(100% + 7px);right:0;display:grid;min-width:210px;padding:7px;border:1px solid rgba(244,241,238,.17);background:#201f1d;box-shadow:0 16px 36px rgba(0,0,0,.25)}

    .work-links a:hover,.work-links a:focus-visible{background:rgba(244,241,238,.08);color:#fff;outline:none}
    .services-panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-height:clamp(470px,62vw,660px);border:1px solid rgba(244,241,238,.12)}
    .service-panel{position:relative;isolation:isolate;display:flex;min-width:0;flex-direction:column;justify-content:flex-end;overflow:hidden;padding:clamp(18px,2.5vw,34px);border-right:1px solid rgba(244,241,238,.2);background:#242220;color:var(--ink);transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s ease}
    .service-panel:last-child{border-right:0}
    .service-panel::before{position:absolute;z-index:-2;inset:0;background-image:var(--panel-photo);background-position:center;background-size:cover;content:"";transition:transform .65s cubic-bezier(.16,1,.3,1)}
    .service-panel::after{position:absolute;z-index:-1;inset:0;background:linear-gradient(180deg,rgba(15,15,15,.3) 0%,rgba(15,15,15,.48) 46%,rgba(15,15,15,.82) 100%);content:""}
    .service-panel:hover::before,.service-panel:focus-visible::before{transform:scale(1.045)}
    .service-panel:hover,.service-panel:focus-visible{z-index:2;transform:scale(1.025);box-shadow:0 18px 46px rgba(0,0,0,.35)}
    .service-panel:focus-visible{outline:2px solid var(--accent);outline-offset:-5px}
    .service-panel-index{position:absolute;top:clamp(20px,2.4vw,34px);left:clamp(20px,2.4vw,34px);z-index:1;color:rgba(244,241,238,.9);font-size:12px;font-weight:600;letter-spacing:.16em;text-shadow:0 2px 10px rgba(0,0,0,.5)}
    .service-panel-copy{display:grid;gap:18px;width:100%;margin-top:auto}
    
    
    
    .service-panel-eyebrow{color:rgba(244,241,238,.78);font-size:10px;font-weight:650;letter-spacing:.2em;text-transform:uppercase}
    .service-panel-eyebrow--top{position:absolute;top:clamp(20px,2.4vw,34px);right:clamp(20px,2.4vw,34px);z-index:1;text-align:right;text-shadow:0 2px 10px rgba(0,0,0,.5)}
    .service-panel-title{font-size:clamp(27px,3.1vw,42px);font-weight:650;letter-spacing:-.07em;line-height:1.03}
    .service-panel-subtitle{margin:0;color:rgba(244,241,238,.82);font-size:clamp(12px,1.05vw,14px);line-height:1.6}
    .service-panel-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 0;border-top:1px solid rgba(244,241,238,.56);font-size:10px;font-weight:650;letter-spacing:.2em;text-transform:uppercase;transition:padding .22s ease,border-color .22s ease}
    .service-panel-cta span{font-size:18px;font-weight:400;transition:transform .22s ease}
    .service-panel:hover .service-panel-cta,.service-panel:focus-visible .service-panel-cta{padding-top:18px;border-color:#fff}
    .service-panel:hover .service-panel-cta span,.service-panel:focus-visible .service-panel-cta span{transform:translate(3px,-3px)}
    .service-panel-content{display:flex;min-height:270px;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:clamp(22px,2.8vw,38px);border:1px solid rgba(244,241,238,.2);background:linear-gradient(135deg,rgba(24,23,22,.82),rgba(24,23,22,.62));backdrop-filter:blur(8px);transition:background .25s ease,border-color .25s ease,transform .3s ease}
    .service-panel:hover .service-panel-content,.service-panel:focus-visible .service-panel-content{transform:translateY(-5px);border-color:rgba(244,241,238,.45);background:linear-gradient(135deg,rgba(24,23,22,.91),rgba(24,23,22,.72))}
    .service-panel-topline{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;margin-bottom:auto;padding-bottom:25px}
    .service-kicker{color:rgba(244,241,238,.76);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
    .service-panel-number{color:rgba(244,241,238,.54);font-size:11px;letter-spacing:.14em}
    .service-panel h2{max-width:12ch;margin:0;font-family:Inter,Arial,sans-serif;font-size:clamp(27px,3.1vw,42px);font-weight:650;letter-spacing:-.07em;line-height:1.03}
    .service-panel p{max-width:32ch;margin:14px 0 0;color:rgba(244,241,238,.78);font-size:clamp(12px,1.05vw,14px);line-height:1.6}
    
    
    
    
    
    .service-explore{display:flex;width:100%;align-items:center;justify-content:space-between;gap:13px;margin-top:24px;padding-top:15px;border-top:1px solid rgba(244,241,238,.25);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
    .service-explore::after{display:grid;width:31px;height:31px;place-items:center;border:1px solid rgba(244,241,238,.42);border-radius:50%;font-size:16px;font-weight:400;content:"↗";transition:color .2s ease,background .2s ease,border-color .2s ease}
    .service-panel:hover .service-explore::after,.service-panel:focus-visible .service-explore::after{border-color:var(--ink);background:var(--ink);color:var(--canvas)}
    .landing{position:relative;display:flex;width:100%;max-width:none;min-height:100svh;flex-direction:column;padding:0;overflow:hidden;background:#181716}
    .navbar{position:absolute;z-index:5;top:0;right:0;left:0;min-height:86px;padding:0 clamp(24px,5.2vw,88px)}
    .navbar-contact-link{display:inline-flex;min-height:42px;align-items:center;gap:15px;margin-left:auto;padding:0 15px;border:1px solid rgba(244,241,238,.42);color:rgba(244,241,238,.9);font-size:9px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;transition:background .2s ease,border-color .2s ease,color .2s ease}
    .navbar-contact-link:after{font-size:16px;font-weight:400;content:"↗";transition:transform .2s ease}
    .navbar-contact-link:hover,.navbar-contact-link:focus-visible{border-color:#d2b49b;background:rgba(244,241,238,.09);color:#fff}
    .navbar-contact-link:hover:after,.navbar-contact-link:focus-visible:after{transform:translate(2px,-2px)}
    .home-featured{position:relative;isolation:isolate;width:100%;height:100%;min-height:100svh;overflow:hidden;background:#242220}
    .home-slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(36px,7vw,94px) clamp(28px,10vw,145px);opacity:0;pointer-events:none;transform:scale(1.025);transition:opacity .65s ease,transform 1.2s cubic-bezier(.16,1,.3,1)}
    .home-slide.is-active{z-index:1;opacity:1;pointer-events:auto;transform:scale(1)}
    .home-slide:before{position:absolute;z-index:-2;inset:0;background-image:var(--slide-image);background-position:center 46%;background-size:cover;content:"";transition:transform 7s cubic-bezier(.16,1,.3,1)}
    .home-slide.is-active:before{transform:scale(1.035)}
    .home-slide:after{position:absolute;z-index:-1;inset:0;background:linear-gradient(90deg,rgba(18,17,16,.78) 0%,rgba(18,17,16,.5) 44%,rgba(18,17,16,.22) 100%),linear-gradient(0deg,rgba(18,17,16,.52),transparent 40%,rgba(18,17,16,.12));content:""}
    .home-slide-content{width:min(660px,74%)}
    .home-slide h1{max-width:9ch;margin:0;font-family:Inter,Arial,sans-serif;font-size:clamp(54px,9.4vw,132px);font-weight:700;line-height:.88;letter-spacing:-.09em}
    .home-slide-copy{max-width:45ch;margin:clamp(20px,3vw,32px) 0 0;color:rgba(244,241,238,.83);font-size:clamp(13px,1.2vw,15px);line-height:1.75}
    .home-slide-cta{display:inline-flex;align-items:center;gap:19px;margin-top:clamp(22px,3.5vw,40px);padding:0 0 8px;border-bottom:1px solid rgba(244,241,238,.6);color:#f4f1ee;font-size:10px;font-weight:650;letter-spacing:.17em;text-transform:uppercase;transition:gap .2s ease,border-color .2s ease}
    .home-slide-cta:hover,.home-slide-cta:focus-visible{gap:26px;border-color:#d2b49b;color:#d2b49b}
    .home-slide-cta span{font-size:18px;font-weight:400}
    .home-slide-meta{position:absolute;top:50%;right:clamp(30px,7vw,98px);display:grid;gap:5px;text-align:right;transform:translateY(-50%)}
    .home-slide-meta span{font-size:clamp(16px,2vw,22px);font-weight:500;letter-spacing:-.04em}
    .home-slider-controls{position:absolute;z-index:3;inset:50% 0 auto;display:flex;justify-content:space-between;padding:0 18px;transform:translateY(-50%);pointer-events:none}
    .home-slider-controls button{display:grid;width:42px;height:42px;place-items:center;border:1px solid rgba(244,241,238,.38);border-radius:50%;background:rgba(24,23,22,.18);color:#f4f1ee;font:22px Inter,Arial,sans-serif;cursor:pointer;pointer-events:auto;transition:background .2s ease,border-color .2s ease,transform .2s ease}
    .home-slider-controls button:hover,.home-slider-controls button:focus-visible{transform:scale(1.06);border-color:#f4f1ee;background:rgba(24,23,22,.55);outline:none}
    .home-slide-count{position:absolute;z-index:3;right:clamp(30px,7vw,98px);bottom:clamp(26px,4vw,52px);display:flex;align-items:center;gap:10px;color:rgba(244,241,238,.8);font-size:11px;font-weight:550;letter-spacing:.2em;font-variant-numeric:tabular-nums}
    .home-slide-count:before{width:34px;height:1px;background:rgba(244,241,238,.54);content:""}
    @media(max-width:700px){.navbar{padding:0 22px}.home-slide{justify-content:flex-end;padding:110px 28px 96px}.home-slide-content{width:100%}.home-slide h1{font-size:clamp(55px,15vw,92px)}.home-slide-meta{top:43%;right:28px;transform:translateY(-50%)}.home-slider-controls{top:46%;padding:0 10px}.home-slider-controls button{width:36px;height:36px}.home-slide-count{right:28px;bottom:30px}}
    @media(max-width:430px){.home-slide{padding-right:22px;padding-left:22px}.home-slide-copy{max-width:34ch}}
    @media(prefers-reduced-motion:reduce){.home-slide,.home-slide:before,.home-slider-controls button,.home-slide-cta{transition:none!important}}

    .home-featured{display:grid;height:auto;min-height:0;flex:1;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 clamp(24px,5.2vw,88px) clamp(24px,3vw,40px);overflow:visible;background:#181716}
    .home-featured{display:grid;height:auto;min-height:0;flex:1;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 clamp(24px,5.2vw,88px) clamp(24px,3vw,40px);overflow:visible;background:#181716}
    .home-panel{position:relative;isolation:isolate;display:flex;min-height:calc(100svh - 110px);flex-direction:column;justify-content:flex-end;overflow:hidden;padding:clamp(22px,3vw,42px);border:1px solid rgba(244,241,238,.2);color:var(--ink);text-decoration:none}
    .home-panel::before{position:absolute;z-index:-2;inset:0;background-image:var(--slide-image);background-position:center;background-size:cover;content:"";transition:transform .7s cubic-bezier(.16,1,.3,1)}
    .home-panel::after{position:absolute;z-index:-1;inset:0;background:linear-gradient(180deg,rgba(18,17,16,.14) 0%,rgba(18,17,16,.22) 35%,rgba(18,17,16,.84) 100%);content:""}
    .home-panel-top{position:absolute;top:clamp(22px,3vw,42px);right:clamp(22px,3vw,42px);left:clamp(22px,3vw,42px);display:flex;align-items:flex-start;justify-content:space-between;gap:18px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
    .home-panel-number{font-size:12px;font-weight:600;letter-spacing:.18em}
    .home-panel-kicker{max-width:12ch;text-align:right;font-size:9px;font-weight:650;letter-spacing:.18em;text-transform:uppercase}
    .home-panel-kicker--consulting{max-width:none;white-space:nowrap}
    .home-panel h1{max-width:10ch;margin:0;font-family:Inter,Arial,sans-serif;font-size:clamp(21.3px,2.8vw,40.3px);font-weight:700;line-height:.92;letter-spacing:-.08em}
    .home-panel-copy{max-width:38ch;margin:18px 0 0;color:rgba(244,241,238,.85);font-size:clamp(12px,1.05vw,14px);line-height:1.7}
    .home-panel-cta{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px;padding-top:15px;border-top:1px solid rgba(244,241,238,.58);font-size:9px;font-weight:650;letter-spacing:.16em;text-transform:uppercase;transition:color .2s ease,border-color .2s ease}

    .home-panel-cta:hover,.home-panel:focus-visible .home-panel-cta{border-color:var(--accent);color:var(--accent)}
    .home-panel-cta:hover span,.home-panel:focus-visible .home-panel-cta span{transform:translate(3px,-3px)}

    .home-panel:focus-visible{outline:2px solid var(--accent);outline-offset:-5px}
    .home-featured-heading{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.7fr);align-items:end;gap:20px 44px;padding:clamp(38px,6vw,74px) 0 10px;color:#f4f1ee}

    .home-featured-heading h2{margin:8px 0 0;font-size:clamp(34px,5vw,62px);font-weight:600;line-height:.96;letter-spacing:-.075em}
    .home-featured-heading .home-featured-subtitle{max-width:42ch;justify-self:end;color:rgba(244,241,238,.7);font-size:14px;font-weight:400;letter-spacing:0;line-height:1.75;text-transform:none}
    @keyframes home-intro-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
