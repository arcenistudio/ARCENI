<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181716">
  <meta name="description" content="ARCENI — coaching, consulting and basketball development.">
  <title>ARCENI — Home</title>
  <style>
    :root{color-scheme:dark;--canvas:#181716;--ink:#f4f1ee;--accent:#b8b0b3}
    *{box-sizing:border-box}
    html{min-width:320px;background:var(--canvas)}
    body{min-width:320px;min-height:100vh;margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .landing{position:relative;display:flex;width:min(calc(100% - 48px),1400px);min-height:100vh;min-height:100svh;flex-direction:column;margin:0 auto;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,rgba(184,176,179,.075),transparent 37%),var(--canvas)}
    .navbar{position:relative;z-index:2;display:flex;min-height:86px;align-items:center;justify-content:flex-start;padding:0;border:0}
    .basketball-brand{font-size:18px;font-weight:750;letter-spacing:.17em}
    .basketball-brand sup{margin-left:2px;font-size:9px;letter-spacing:0;vertical-align:top}
    .navbar-social{display:flex;align-items:center;gap:12px;margin-left:auto;margin-right:0}
    .navbar-social a{display:grid;width:25px;height:25px;place-items:center;color:rgba(244,241,238,.78);transition:color .2s ease,transform .2s ease}
    .navbar-social a:hover,.navbar-social a:focus-visible{color:#fff;transform:translateY(-2px);outline:none}
    .navbar-social a:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
    .navbar-social svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .work-menu{position:relative;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
    .work-menu summary{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;list-style:none}
    .work-menu summary::-webkit-details-marker{display:none}
    .work-menu summary::after{content:'+';font-size:16px;font-weight:400;transition:transform .2s ease}
    .work-menu[open] summary::after{transform:rotate(45deg)}
    .work-links{position:absolute;z-index:4;top:calc(100% + 7px);right:0;display:grid;min-width:210px;padding:7px;border:1px solid rgba(244,241,238,.17);background:#201f1d;box-shadow:0 16px 36px rgba(0,0,0,.25)}
    .work-links a{padding:13px 12px;color:rgba(244,241,238,.78);font-size:10px;letter-spacing:.1em;transition:background .2s ease,color .2s ease}
    .work-links a:hover,.work-links a:focus-visible{background:rgba(244,241,238,.08);color:#fff;outline:none}
    .home-hero{position:relative;display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px 72px;text-align:center}
    .brand-lockup{display:grid;justify-items:center;gap:24px;margin-top:-22px}
    .brand-mark{display:block;width:clamp(108px,14vw,170px);height:auto;filter:drop-shadow(0 8px 30px rgba(0,0,0,.18));transition:transform .35s cubic-bezier(.16,1,.3,1),filter .35s ease}
    .brand-lockup:hover .brand-mark,.brand-lockup:focus-visible .brand-mark{transform:scale(1.09);filter:drop-shadow(0 10px 36px rgba(184,176,179,.26))}
    .brand-lockup:focus-visible{outline:1px solid var(--accent);outline-offset:12px}
    .brand-wordmark{margin:0;color:var(--ink);font-family:Arial,sans-serif;font-size:clamp(42px,7.2vw,88px);font-weight:700;letter-spacing:.19em;line-height:1}
    .hero-links{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(24px,5vw,64px);margin-top:clamp(30px,5vh,54px)}
    .hero-link{position:relative;padding:10.4px 0 13px;color:rgba(244,241,238,.86);font-size:clamp(13px,1.3vw,15.6px);font-weight:600;letter-spacing:.17em;text-transform:uppercase;transition:color .22s ease,transform .22s ease}
    .hero-link::after{position:absolute;right:0;bottom:0;left:0;height:1px;background:var(--accent);content:"";transform:scaleX(.45);transform-origin:center;transition:transform .24s ease,background .24s ease}
    .hero-link:hover,.hero-link:focus-visible{color:#fff;transform:translateY(-2px);outline:none}
    .hero-link:hover::after,.hero-link:focus-visible::after{background:#f4f1ee;transform:scaleX(1)}
    .hero-link:focus-visible{outline:1px solid var(--accent);outline-offset:7px}
    .landing-footer{display:flex;min-height:48px;align-items:center;justify-content:center;padding:10px 20px 18px;color:rgba(244,241,238,.5);font-size:9px;letter-spacing:.06em;text-align:center}
    @media(max-width:560px){.home-hero{padding:44px 20px 60px}.brand-lockup{gap:20px}.brand-mark{width:100px}.brand-wordmark{font-size:clamp(36px,11vw,54px);letter-spacing:.14em}.hero-links{flex-direction:column;align-items:center;gap:20px;margin-top:30px}.hero-link{padding:10.4px 0 13px;font-size:13px}}
  </style>
</head>
<body>
  <div class="landing">
    <header class="navbar">
      <a class="basketball-brand" href="index.html" aria-label="ARCENI home">ARCENI<sup>®</sup></a><nav class="navbar-social" aria-label="Social media"><a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.7" cy="6.5" r=".7" fill="currentColor" stroke="none"/></svg></a><a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 7.2a2.8 2.8 0 0 0-2-2C17.3 4.7 12 4.7 12 4.7s-5.3 0-7 .5a2.8 2.8 0 0 0-2 2A29 29 0 0 0 2.5 12a29 29 0 0 0 .5 4.8 2.8 2.8 0 0 0 2 2c1.7.5 7 .5 7 .5s5.3 0 7-.5a2.8 2.8 0 0 0 2-2A29 29 0 0 0 21.5 12a29 29 0 0 0-.5-4.8Z"/><path d="m10 9 5 3-5 3z"/></svg></a><a href="https://www.linkedin.com/company/arceni/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7v.01M12 17v-7m0 3a3 3 0 0 1 6 0v4"/></svg></a></nav>
    </header>
    <main class="home-hero">
      <a class="brand-lockup" href="index.html" aria-label="ARCENI home">
        <img class="brand-mark" src="Logos/arceni-mark-transparent.png" alt="ARCENI mark">
      </a>
      <nav class="hero-links" aria-label="Explore ARCENI">
        <a class="hero-link" href="collective.html">The Collective</a>
        <a class="hero-link" href="consulting.html">The Consulting</a>
        <a class="hero-link" href="basketball.html">The Basketball</a>
      </nav>
    </main>
    <footer class="landing-footer"><small>© 2026 ARCENI. All rights reserved.</small></footer>
  </div>
</body>
</html>
