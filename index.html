        <p class="home-showcase-eyebrow">01 <span>·</span> Consulting</p>

        <p class="home-showcase-description">Practical support to help organizations shape priorities, strengthen project delivery and sustain results for impact.</p>
        <a class="home-showcase-cta" aria-disabled="true">Explore consulting <span aria-hidden="true">↗</span></a>

        <button type="button" class="is-current"><span>01</span><strong>Consulting</strong><small>Strategy &amp; delivery</small></button>
        <button type="button"><span>02</span><strong>The Collective</strong><small>Coaching &amp; leadership</small></button>
        <button type="button"><span>03</span><strong>The Basketball</strong><small>Player development</small></button>

  </main>

  <script>
    (() => {
      const slides = [
        {category:'Strategy for Change',title:'CONSULTING',description:'Practical support to help organizations shape priorities, strengthen project delivery and sustain results for impact.',image:'images/Consulting/anastasia-vityukova-Q3qKcPAGrKw-unsplash.jpg',href:null,cta:'Explore consulting'},
        {category:'Clarity to Impact',title:'COACHING',description:'Bespoke coaching and workshops for individuals and teams to find their voice, build self-awareness and lead with purpose.',image:'images/Collective/wadi-lissa-AZvGpBp925o-unsplash.jpg',href:'collective.html',cta:'Join Program'},
        {category:'Train With Purpose',title:'BASKETBALL',description:'Personalized training, holistic development and leadership for players and teams to gain a competitive edge on and off the court.',image:'images/Basketball/Slytherin.jpg',href:'basketball.html',cta:'Work With Us'}
      ];
      const hero = document.querySelector('.home-showcase');
      if (!hero) return;
      const image = hero.querySelector('.home-showcase-image');
      const category = hero.querySelector('.home-showcase-category');
      const eyebrow = hero.querySelector('.home-showcase-eyebrow');
      const title = hero.querySelector('.home-showcase-title');
      const description = hero.querySelector('.home-showcase-description');
      const cta = hero.querySelector('.home-showcase-cta');
      const current = hero.querySelector('.home-showcase-current');
      const dots = [...hero.querySelectorAll('.home-showcase-dots button')];
      const rail = [...hero.querySelectorAll('.home-showcase-rail button')];
      const previous = hero.querySelector('.home-showcase-prev');
      const next = hero.querySelector('.home-showcase-next');
      let activeSlide = 0;
      function showSlide(index) {
        activeSlide = index;
        const slide = slides[index];
        image.style.backgroundImage = `url("${slide.image}")`;
        category.textContent = slide.category;
        eyebrow.innerHTML = `${String(index + 1).padStart(2,'0')} <span>·</span> ${slide.category}`;
        title.innerHTML = slide.title;
        description.textContent = slide.description;
        if (slide.href) {
          cta.href = slide.href;
          cta.removeAttribute('aria-disabled');
          cta.hidden = false;
        } else {
          cta.removeAttribute('href');
          cta.setAttribute('aria-disabled','true');
          cta.hidden = true;
        }
        cta.firstChild.textContent = `${slide.cta} `;
        current.textContent = String(index + 1).padStart(2,'0');
        current.setAttribute('aria-label', `Slide ${index + 1} of ${slides.length}`);
        dots.forEach((button,i) => button.setAttribute('aria-current',String(i === index)));
        rail.forEach((button,i) => button.classList.toggle('is-current',i === index));
      }
      dots.forEach((button,index) => button.addEventListener('click',() => showSlide(index)));
      rail.forEach((button,index) => button.addEventListener('click',() => showSlide(index)));
      previous.addEventListener('click',() => showSlide((activeSlide + slides.length - 1) % slides.length));
      next.addEventListener('click',() => showSlide((activeSlide + 1) % slides.length));
      showSlide(0);
      window.setInterval(() => showSlide((activeSlide + 1) % slides.length), 4000);
    })();
  </script>
